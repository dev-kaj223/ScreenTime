name: ScreenTime package
on:
  push:
    branches: [ screentime-dev ]
  pull_request:
    branches: [ screentime-dev ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and audit isolated package
        shell: pwsh
        run: ./publish.ps1 -BuildLabel ci
      - name: Verify package manifest and safe profile probe
        shell: pwsh
        run: ./tools/Test-ReleasePackage.ps1 -Package artifacts/ci/ScreenTime-win-x64.zip
      - name: Upload candidate (no tags or public releases)
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTime-win-x64-candidate
          path: artifacts/ci/*
          if-no-files-found: error
          retention-days: 30
